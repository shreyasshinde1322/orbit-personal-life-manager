    <path d="M1800 1831 V2130 M1635 1860 H1800 M1635 1935 H1800 M1635 2010 H1800 M1965 1860 H1800 M1965 1935 H1800 M1965 2010 H1800"/>
    <path d="M3000 1831 V2130 M2905 1860 H3000 M3095 1860 H3000 M2905 1935 H3000"/>
