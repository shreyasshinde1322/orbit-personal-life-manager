  <!-- Constraint and storage notes -->
  <rect class="note-box" x="200" y="2298" width="3200" height="86" rx="8"/>
  <text class="note-head" x="230" y="2328">PARENT XOR CONSTRAINTS</text>
  <text class="note-text" x="230" y="2356">* For ATTACHMENTS and REMINDERS, exactly one parent FK is populated: CHECK ((record_id IS NOT NULL) &lt;&gt; (obligation_id IS NOT NULL)). Each FK references its matching parent entity.</text>
  <text class="note-text" x="230" y="2376">No RECORDS–OBLIGATIONS link is implied. The two HAS links to ATTACHMENTS and the two HAS links to REMINDERS are separate relationships.</text>

  <!-- Legend -->
  <g transform="translate(205 2424)">
    <rect class="legend-entity" x="0" y="0" width="48" height="30"/><text class="legend-text" x="60" y="21">Rectangle = Entity</text>
    <ellipse class="legend-oval" cx="300" cy="15" rx="27" ry="15"/><text class="legend-text" x="340" y="21">Oval = Attribute</text>
    <path class="legend-diamond" d="M620,0 L647,15 L620,30 L593,15 Z"/><text class="legend-text" x="660" y="21">Diamond = Relationship</text>
    <text class="legend-text" x="930" y="21" text-decoration="underline">record_id</text><text class="legend-text" x="1015" y="21">Underlined = PK</text>
    <text class="legend-text" x="1210" y="21">(FK) = Foreign Key</text><text class="legend-text" x="1430" y="21">1 = One</text><text class="legend-text" x="1550" y="21">N = Many</text>
  </g>
  <text class="footer" x="1800" y="2500" text-anchor="middle">SQLite schema design · Room persistence layer (proposed) · Android</text>
