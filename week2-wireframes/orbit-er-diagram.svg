    <path d="M1650 151 V515 M1950 151 V515 M1635 180 H1650 M1635 250 H1650 M1635 320 H1650 M1675 180 H1650 M1675 250 H1650 M1675 320 H1650 M1965 180 H1950 M1965 250 H1950"/><path d="M1650 515 H1680 M1950 515 H1920"/>
    <path d="M2885 151 V515 M3175 151 V515 M2865 180 H2885 M2865 250 H2885 M2865 320 H2885 M2865 390 H2885 M2865 460 H2885 M2905 180 H2885 M2905 250 H2885 M2905 320 H2885 M2905 390 H2885 M3195 180 H3175 M3195 250 H3175 M3195 320 H3175"/><path d="M2885 515 H2890 M3175 515 H3140"/>
