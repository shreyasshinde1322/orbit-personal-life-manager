<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 3600 2545" role="img" aria-labelledby="title description">
  <title id="title">ORBIT – ENTITY RELATIONSHIP DIAGRAM</title>
  <desc id="description">Chen ER diagram for the Orbit personal life operations hub. It contains seven entities, all specified attributes, four one-to-many HAS relationships, and standalone shopping items, notes, and app settings.</desc>
  <defs>
    <style>
      .page{fill:#fff}.ink{fill:#17263b}.title{font:700 44px Arial, sans-serif;fill:#17263b;letter-spacing:1px}.subtitle{font:400 24px Arial,sans-serif;fill:#526174}.small{font:400 17px Arial,sans-serif;fill:#405168}.section-label{font:700 18px Arial,sans-serif;fill:#607087;letter-spacing:2px}.entity{fill:#eaf1f8;stroke:#17263b;stroke-width:3}.entity-text{font:700 22px Arial,sans-serif;fill:#17263b;letter-spacing:1px}.oval{fill:#fff;stroke:#31445d;stroke-width:2}.attr-name{font:600 16px Arial,sans-serif;fill:#1f2e42}.attr-type{font:400 13px Arial,sans-serif;fill:#657388}.relation{fill:#fff;stroke:#17263b;stroke-width:3}.rel-text{font:700 18px Arial,sans-serif;fill:#17263b;letter-spacing:1px}.connector{fill:none;stroke:#35465c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.cardinality{font:700 18px Arial,sans-serif;fill:#17263b}.note-box{fill:#f8fafc;stroke:#8291a3;stroke-width:1.5}.note-head{font:700 17px Arial,sans-serif;fill:#24364d}.note-text{font:400 15px Arial,sans-serif;fill:#45556a}.legend-text{font:400 15px Arial,sans-serif;fill:#33445a}.footer{font:400 15px Arial,sans-serif;fill:#68778a}.legend-entity{fill:#eaf1f8;stroke:#17263b;stroke-width:2}.legend-oval{fill:#fff;stroke:#31445d;stroke-width:1.8}.legend-diamond{fill:#fff;stroke:#17263b;stroke-width:2}
    </style>
    <g id="entity"><rect class="entity" x="-160" y="-50" width="320" height="100" rx="2"/></g>
    <g id="relation"><path class="relation" d="M0,-43 L76,0 L0,43 L-76,0 Z"/></g>
  </defs>
  <rect class="page" x="0" y="0" width="3600" height="2545"/>
  <text class="title" x="1800" y="62" text-anchor="middle">ORBIT – ENTITY RELATIONSHIP DIAGRAM</text>
  <text class="subtitle" x="1800" y="101" text-anchor="middle">Database Design for Personal Life Operations Hub</text>
  <text class="section-label" x="600" y="139" text-anchor="middle">PERSONAL RECORDS</text>
